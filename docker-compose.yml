services:
  postgis:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: boundlessgis-postgis:18-3.6
    container_name: boundlessgis-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boundlessgis
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boundlessgis"]
      interval: 5s
      timeout: 5s
      retries: 20

  service:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: boundlessgis-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/boundlessgis
      STATIC_DIR: /app/static
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "5178:8080"
